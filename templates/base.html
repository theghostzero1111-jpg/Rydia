<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.brand }} | {{ site.tagline }}{% endblock %}</title>
<meta name="description" content="{{ site.tagline }} - {{ site.subtitle }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-container" id="flashContainer">
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">
        <span>{{ message }}</span>
        <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<!-- Three.js r128 UMD build exposes the global THREE object used by hero3d.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
{% block scripts %}{% endblock %}
<script>
  setTimeout(() => {
    document.querySelectorAll('.flash').forEach(f => {
      f.style.transition = 'opacity .6s ease, transform .6s ease';
      f.style.opacity = '0';
      f.style.transform = 'translateX(40px)';
      setTimeout(() => f.remove(), 600);
    });
  }, 5000);
</script>
</body>
</html>
